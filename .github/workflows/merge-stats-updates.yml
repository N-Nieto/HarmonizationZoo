name: Merge stats updates

on:
  push:
    branches: [main]
    paths:
      - "data/submissions-stats/*.json"

permissions:
  contents: write

concurrency:
  group: merge-stats-updates
  cancel-in-progress: false  # never cancel a merge mid-write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fold stats updates into methods.json
        run: python3 scripts/merge_stats_updates.py

      - name: Check for duplicates
        run: python3 scripts/check_duplicates.py --ci

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: apply fetched stats/citations update(s)"
          title: "chore: apply fetched stats/citations update(s)"
          body: |
            Automated merge from `scripts/merge_stats_updates.py`
            (`.github/workflows/merge-stats-updates.yml`), folding
            `data/submissions-stats/*.json` into `data/methods.json`.
            Opened as a PR rather than pushed directly, since a direct push
            would be silently rejected if branch protection requires
            review for every change to `main` — see "Repository
            protection" in `MAINTAINERS.md`.
          branch: bot/merge-stats-updates
          delete-branch: true
          labels: automated
