name: Refresh citations

on:
  schedule:
    - cron: "37 5 1 * *"   # 1st of each month, 05:37 UTC — citation counts change slowly
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-citations
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This is the actual fix for citations never populating from the
      # on-demand browser button: Semantic Scholar doesn't support
      # cross-origin browser requests the way GitHub's API does, so that
      # button can never fetch citations no matter how it's written. A
      # plain server-side Python process (this job) was never subject to
      # that restriction in the first place.
      - name: Fetch citation counts
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: python3 scripts/fetch_citations.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh citation counts"
          title: "chore: refresh citation counts"
          body: |
            Automated update from `scripts/fetch_citations.py`
            (`.github/workflows/refresh-citations.yml`). Opened as a PR
            rather than pushed directly, since a direct push would be
            silently rejected if branch protection requires review for
            every change to `main` — see "Repository protection" in
            `MAINTAINERS.md`.
          branch: bot/refresh-citations
          delete-branch: true
          labels: automated
