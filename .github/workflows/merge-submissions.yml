name: Merge submitted methods

on:
  push:
    branches: [main]
    paths:
      - "data/submissions/*.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-submissions
  cancel-in-progress: false  # never cancel a merge mid-write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fold submissions into methods.json
        run: python3 scripts/merge_submissions.py

      - name: Check for duplicates
        run: python3 scripts/check_duplicates.py --ci

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: merge submitted method(s) into the database"
          title: "chore: merge submitted method(s) into the database"
          body: |
            Automated merge from `scripts/merge_submissions.py`
            (`.github/workflows/merge-submissions.yml`), folding
            `data/submissions/*.json` into `data/methods.json`. Opened as a
            PR rather than pushed directly, since a direct push would be
            silently rejected if branch protection requires review for
            every change to `main` — see "Repository protection" in
            `MAINTAINERS.md`.
          branch: bot/merge-submissions
          delete-branch: true
          labels: automated
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
