name: Check for duplicate methods

on:
  pull_request:
    paths:
      - "data/methods.json"
      - "data/toolboxes.json"
  push:
    branches: [main]
    paths:
      - "data/methods.json"
      - "data/toolboxes.json"

concurrency:
  group: check-duplicates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check_duplicates.py --ci
      - run: python3 scripts/validate_methods.py