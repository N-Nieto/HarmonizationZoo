name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab
  push:
    branches: [main]
    paths:
      - "data/methods.json"
      - "scripts/build_seed.py"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_stats.py

      - name: Commit updated data
        run: |
          git config user.name "harmonization-zoo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/methods.json
          git diff --cached --quiet || git commit -m "chore: refresh GitHub stats"
          git push
