name: Refresh GitHub stats

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Refetch every repo, ignoring the 30-day freshness window"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "data/methods.json"
      - "scripts/build_seed.py"

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The script itself skips any entry fetched within the last 30 days,
      # so this can safely run on every push to data/methods.json without
      # hammering the GitHub API for repos that haven't changed — new or
      # previously-failed entries are always fetched regardless of that
      # window. Use the "force" input (Actions tab → Run workflow) for a
      # full refresh of everything.
      - name: Fetch live GitHub stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github_stats.py ${{ inputs.force && '--force' || '' }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh GitHub stats"
          title: "chore: refresh GitHub stats"
          body: |
            Automated update from `scripts/fetch_github_stats.py`
            (`.github/workflows/refresh-stats.yml`). Opened as a PR rather
            than pushed directly, since a direct push would be silently
            rejected if branch protection requires review for every change
            to `main` — see "Repository protection" in `MAINTAINERS.md`.
          branch: bot/refresh-stats
          delete-branch: true
          labels: automated
